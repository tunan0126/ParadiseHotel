<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Create abstract luxury architecture (tower/sculpture)
const group = new THREE.Group();

const material = new THREE.MeshPhongMaterial({ 
    color: 0xD4AF37, 
    shininess: 100,
    transparent: true,
    opacity: 0.8
});

// Central core
const coreGeo = new THREE.CylinderGeometry(0.5, 0.8, 4, 32);
const core = new THREE.Mesh(coreGeo, material);
group.add(core);

// Floating rings/balconies
for(let i=0; i<8; i++) {
    const ringGeo = new THREE.TorusGeometry(1.2 + i*0.1, 0.05, 16, 100);
    const ring = new THREE.Mesh(ringGeo, material);
    ring.position.y = -2 + i * 0.6;
    ring.rotation.x = Math.PI / 2;
    group.add(ring);
}

scene.add(group);

const light = new THREE.PointLight(0xffffff, 1, 100);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 8;

function animate() {
    requestAnimationFrame(animate);
    group.rotation.y += 0.005;
    
    // Parallax effect based on scroll (handled via window scroll listener)
    const scrollY = window.scrollY;
    group.position.y = scrollY * 0.002;
    group.rotation.x = scrollY * 0.001;
    
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
